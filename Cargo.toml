[workspace]
members = ["backend"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["william.d.zk <william@isahl.com>"]
license = "MIT"
repository = "https://github.com/CosmicTools9/AppCreator"

[workspace.dependencies]
# Shared by app-creator backend
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
thiserror = "2.0.18"
chrono = { version = "0.4", features = ["serde"] }
