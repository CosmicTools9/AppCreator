[tasks]
setup = "cargo fetch && cargo check"
dev = "bash ../scripts/lib/guard-mise-task.sh AppCreator -- cargo run"
build = "cargo build --release"
test = "DATABASE_URL=postgres://isahl@localhost/aliothstudio_test bash ../scripts/lib/guard-mise-task.sh AppCreator --mode test -- cargo test"
lint = "cargo clippy -- -D warnings && cargo fmt --check"
fmt = "cargo fmt"
clean = "cargo clean"

[env]
_.file = ".env"
_.source = "../scripts/env/decrypt-env.sh"
RUST_LOG = "info"
SERVER_ADDR = "127.0.0.1:49495"
LLM_PROVIDER = "deepseek"
LLM_MODEL = "deepseek-v4-pro"
LLM_TIMEOUT_SECONDS = "300"
LLM_MAX_RETRIES = "3"
LLM_TEMPERATURE = "0.7"
LLM_MAX_TOKENS = "4096"
LLM_REASONING_EFFORT = "medium"
