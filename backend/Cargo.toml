[package]
name = "app-creator"
version.workspace = true
edition.workspace = true
description = "AliothStudio AppCreator Service — AI-powered prototype creation via dialogue"
default-run = "app-creator"

[dependencies]
app-agent = { path = "vendor/app-agent" }
common = { path = "vendor/common" }
llm = { path = "vendor/llm" }
actix-web = "4.13"
actix-cors = { workspace = true }
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = { workspace = true }
chrono = { workspace = true }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "macros", "json"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
base64 = { workspace = true }

env_logger = "0.11"
log = "0.4"
actix-files = "0.6"
async-trait = { workspace = true }
futures = { workspace = true }
