[package]
name = "alioth-gen"
version = "0.1.0"
edition = "2021"
authors = ["william.d.zk <william@isahl.com>"]
license = "MIT"
description = "Alioth 编译时代码生成引擎：IR→ Zod/API/前端/文档 确定性产物 + 规约校验"

[[bin]]
name = "alioth"
path = "src/main.rs"

[[bench]]
name = "code_generation"
harness = false

[[bench]]
name = "ontology_reasoner"
harness = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10"
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
sha2 = "0.11"
validator = { version = "0.20", features = ["derive"] }
regex = "1.10"
common = { path = "../common" }

rust_decimal = { version = "1.35", features = ["serde"] }
runtime-contract = { path = "../runtime-contract" }
meta-model = { path = "../meta-model" }

# HTTP client for registry CLI
reqwest = { workspace = true, features = ["json", "blocking"] }

# Code generation utilities
convert_case = { workspace = true }
diffy = "0.5"
similar = "3.1"
hex = "0.4"
md5 = "0.8"
pluralizer = { workspace = true }
tempfile = "3.0"
walkdir = "2.5"

# CLI
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"

# Directory paths
dirs = "6.0"

# Parallel processing
rayon = "1.10"

# Metrics
prometheus = "0.14"
crc32fast = "1.3"
log = "0.4"

# Random generation
rand = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
