# 包含语法错误的 DSL 示例
version: "1.0"
meta_model:
  name: invalid_syntax_model
  display_name: 语法错误模型
collections:
  - name: users
    display_name: 用户
    fields:
      - name: id
        field_type: uuid
        nullable: false
        primary_key: true
      - name: name
        field_type: string
        # 这里缺少冒号，会导致语法错误
        nullable true
      - name: email
        field_type: string
        nullable: true
