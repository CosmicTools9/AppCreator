[tasks]
setup = "pnpm install"
dev = "bun run dev"
build = "bun run build"
test = "bun run test"
lint = "bun run lint"
clean = "rm -rf dist node_modules/.cache"
preview = "bun run preview"

[env]
_.file = ".env.local"
_.source = "../scripts/env/decrypt-env.sh"
# NODE_ENV 不于此处设置——mise 会将其注入所有 node 子进程，导致
# `vite build` 恒为 dev-flavored（jsxDev=true；openspec add-alioth-feedback 实证）
VITE_API_URL = "http://localhost:49495"
